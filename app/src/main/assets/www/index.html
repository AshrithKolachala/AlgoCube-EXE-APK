<script>
/* ===== Cube engine: sticker-permutation model =====
   Faces order: U R F D L B. Colour id = id of the face a sticker belongs to when solved.
   Scheme used by the app: U yellow, R orange, F green, D white, L red, B blue. */
(function (root) {
  var FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
  var NORMAL = { U: [0, 1, 0], R: [1, 0, 0], F: [0, 0, 1], D: [0, -1, 0], L: [-1, 0, 0], B: [0, 0, -1] };
  var SLOTS = []; // {pos, n, face}
  var SLOT_INDEX = {};
  function key(p, n) { return p.join(',') + '|' + n.join(','); }
  FACES.forEach(function (f, fi) {
    var n = NORMAL[f];
    for (var a = 1; a >= -1; a--) for (var b = -1; b <= 1; b++) {
      var pos;
      // row/col ordering similar to the standard net (top-left to bottom-right, as seen from outside)
      if (f === 'U') pos = [b, 1, -a];
      else if (f === 'D') pos = [b, -1, a];
      else if (f === 'F') pos = [b, a, 1];
      else if (f === 'B') pos = [-b, a, -1];
      else if (f === 'R') pos = [1, a, -b];
      else pos = [-1, a, b];
      var idx = SLOTS.length;
      SLOTS.push({ pos: pos, n: n.slice(), face: fi });
      SLOT_INDEX[key(pos, n)] = idx;
    }
  });
  function slotAt(p, n) { return SLOT_INDEX[key(p, n)]; }

  function rot(v, axis, k) { // k quarter turns, right-handed about +axis
    k = ((k % 4) + 4) % 4;
    var x = v[0], y = v[1], z = v[2], t;
    for (var i = 0; i < k; i++) {
      if (axis === 0) { t = y; y = -z; z = t; }
      else if (axis === 1) { t = x; x = z; z = -t; }
      else { t = x; x = -y; y = t; }
    }
    return [x, y, z];
  }

  // base move table: name -> {axis, layers, k(clockwise quarter = k)}
  var BASE = {
    R: [0, [1], -1], L: [0, [-1], 1], U: [1, [1], -1], D: [1, [-1], 1], F: [2, [1], -1], B: [2, [-1], 1],
    M: [0, [0], 1], E: [1, [0], 1], S: [2, [0], -1],
    r: [0, [0, 1], -1], l: [0, [-1, 0], 1], u: [1, [0, 1], -1], d: [1, [-1, 0], 1], f: [2, [0, 1], -1], b: [2, [-1, 0], 1],
    x: [0, [-1, 0, 1], -1], y: [1, [-1, 0, 1], -1], z: [2, [-1, 0, 1], -1]
  };

  function parseToken(t) {
    var m = /^([URFDLBMESxyzurfdlb])(w?)(2'|'2|2|')?$/.exec(t);
    if (!m) return null;
    var name = m[1];
    if (m[2] === 'w') name = name.toLowerCase();
    var suf = m[3] || '';
    var turns = (suf === '2' || suf === "2'" || suf === "'2") ? 2 : (suf === "'" ? -1 : 1);
    return { name: name, turns: turns };
  }
  function tokenize(alg) {
    if (Array.isArray(alg)) return alg.slice();
    return String(alg || '').replace(/[()\[\]]/g, ' ').replace(/’/g, "'").split(/\s+/).filter(Boolean);
  }
  function normToken(t) { // 'Rw' -> 'r'
    var p = parseToken(t); if (!p) return t;
    return p.name + (p.turns === 2 ? '2' : (p.turns === -1 ? "'" : ''));
  }
  function tokens(alg) { return tokenize(alg).map(normToken); }

  var PERM_CACHE = {};
  function permFor(name, turns) { // turns: 1,-1,2  (clockwise = +1)
    var ck = name + turns;
    if (PERM_CACHE[ck]) return PERM_CACHE[ck];
    var b = BASE[name];
    var axis = b[0], layers = b[1], k = b[2] * turns;
    var perm = new Array(54);
    for (var i = 0; i < 54; i++) {
      var s = SLOTS[i];
      if (layers.indexOf(s.pos[axis]) >= 0) {
        perm[i] = slotAt(rot(s.pos, axis, k), rot(s.n, axis, k));
      } else perm[i] = i;
    }
    PERM_CACHE[ck] = perm;
    return perm;
  }
  function solved() { var s = new Uint8Array(54); for (var i = 0; i < 54; i++) s[i] = SLOTS[i].face; return s; }
  function applyPerm(state, perm) { var o = new Uint8Array(54); for (var i = 0; i < 54; i++) o[perm[i]] = state[i]; return o; }
  function applyMove(state, tok) {
    var p = parseToken(tok); if (!p) throw new Error('Bad move: ' + tok);
    return applyPerm(state, permFor(p.name, p.turns));
  }
